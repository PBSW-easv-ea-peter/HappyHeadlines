worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream article_service {
        least_conn;
        server 10.100.0.3:30000 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:30000 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:30000 max_fails=3 fail_timeout=5s;
    }

    upstream comment_service {
        least_conn;
        server 10.100.0.3:30020 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:30020 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:30020 max_fails=3 fail_timeout=5s;
    }

    upstream draft_service {
        least_conn;
        server 10.100.0.3:30030 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:30030 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:30030 max_fails=3 fail_timeout=5s;
    }

    upstream profanity_service {
        least_conn;
        server 10.100.0.3:30010 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:30010 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:30010 max_fails=3 fail_timeout=5s;
    }

    upstream journalist_ui {
        least_conn;
        server 10.100.0.3:32000 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:32000 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:32000 max_fails=3 fail_timeout=5s;
    }

    # Journalist UI — port 80
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://journalist_ui;
            include snippets/proxy.conf;
        }
    }

    # Backend APIs — port 8080
    server {
        listen 8080;
        server_name _;

        # Article Service
        location /api/articles {
            proxy_pass http://article_service;
            include snippets/proxy.conf;
        }

        # Comment Service
        location /api/comments {
            proxy_pass http://comment_service;
            include snippets/proxy.conf;
        }

        # Draft Service
        location /api/drafts {
            proxy_pass http://draft_service;
            include snippets/proxy.conf;
        }

        # Profanity Service
        location /api/profanity {
            proxy_pass http://profanity_service;
            include snippets/proxy.conf;
        }

        # Journalist Service
        location /api/journalists {
            proxy_pass http://draft_service;
            include snippets/proxy.conf;
        }
    }
}
