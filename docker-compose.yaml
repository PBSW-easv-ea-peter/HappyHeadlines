        condition: service_healthy

  ## Article Service
  articleservice:
    build:
      context: ./apps/article_service/
    image: happyheadlines/article_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
#    deploy:
#      replicas: 3
    # NOTE: this stack is deployed via `docker stack deploy` (Swarm), which ignores
    # depends_on entirely - this gating is only reliable under plain `docker compose up`
    # (see docker-compose.dev.yaml). Kept here for documentation/local-testing purposes.
    depends_on:
      articledb-eu-migrate:
        condition: service_completed_successfully
      articledb-na-migrate:
        condition: service_completed_successfully
      articledb-sa-migrate:
        condition: service_completed_successfully
      articledb-au-migrate:
        condition: service_completed_successfully
      articledb-as-migrate:
        condition: service_completed_successfully
      articledb-an-migrate:
        condition: service_completed_successfully
      articledb-af-migrate:
        condition: service_completed_successfully
      articledb-global-migrate:
        condition: service_completed_successfully

# ──────────────────────────────────────────────────────────────────────────────
#        Comments
# ──────────────────────────────────────────────────────────────────────────────

  commentdb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    volumes:
      - ./database/init/comment/comment_baseline.sql:/docker-entrypoint-initdb.d/01_comment_baseline.sql:ro
      - ./database/queries/comment/seed_comments.sql:/docker-entrypoint-initdb.d/02_seed_comments.sql:ro

  profanitydb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    volumes:
      - ./database/init/profanity/profanity_baseline.sql:/docker-entrypoint-initdb.d/01_profanity_baseline.sql:ro
      - ./database/queries/profanity/seed_banned_words.sql:/docker-entrypoint-initdb.d/02_seed_banned_words.sql:ro

  profanityservice:
    build:
      context: ./apps/profanity_service/
    image: happyheadlines/profanity_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
    ports:
      - "8081:8081"

  commentservice:
    build:
      context: ./apps/comment_service/
    image: happyheadlines/comment_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
    ports:
      - "8082:8082"

# ──────────────────────────────────────────────────────────────────────────────
#        Drafts
