# Minimal single-binary Tempo backed by the local filesystem (dev only).
# Traces arrive from the OTel Collector over OTLP gRPC; Grafana queries port 3200.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
