worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream article_service {
        least_conn;
        server 10.100.0.3:30000 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:30000 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:30000 max_fails=3 fail_timeout=5s;
    }

    upstream comment_service {
        least_conn;
        server 10.100.0.3:30020 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:30020 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:30020 max_fails=3 fail_timeout=5s;
    }

    upstream journalist_ui {
        least_conn;
        server 10.100.0.3:32000 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:32000 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:32000 max_fails=3 fail_timeout=5s;
    }

    # Journalist UI — port 80
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://journalist_ui;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    # Backend APIs — port 8080
    server {
        listen 8080;
        server_name _;

        location /api/articles {
            proxy_pass http://article_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /api/comments {
            proxy_pass http://comment_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
