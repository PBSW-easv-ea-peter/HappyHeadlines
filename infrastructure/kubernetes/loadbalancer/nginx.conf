
worker_processes auto;

events {
    worker_connections 1024;
}

stream {
    upstream kube_apiserver {
        least_conn;
        server 10.100.0.3:6443 max_fails=3 fail_timeout=5s;
        server 10.100.0.5:6443 max_fails=3 fail_timeout=5s;
        server 10.100.0.7:6443 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 6443;
        proxy_pass kube_apiserver;
        proxy_timeout 30s;
        proxy_connect_timeout 5s;
    }

