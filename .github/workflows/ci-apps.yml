name: Apps CI Pipeline

# Trigger: runs only when a PR is merged into master
on:
  push:
    branches:
      - feature/Add_CI_Pipeline
  # pull_request:
  #   types:
  #     - closed
  #   branches:
  #     - master
  #   paths:
  #     - 'apps/**'

jobs:
  build:
    # Only run if the PR was actually merged (not just closed/dismissed)
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Lowercase repo name ----
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/article-service" >> $GITHUB_ENV

      # ---- Login to GHCR ----
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Docker Build & Push ----
      - name: Build and push Docker image
        run: |
          docker build \
            -f apps/article_service/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            apps/
          docker push ${{ env.IMAGE_NAME }} --all-tags