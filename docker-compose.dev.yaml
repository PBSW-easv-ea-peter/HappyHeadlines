## Structirizr inde i 'C4 diagram*' anvender port 8081
services:

# ──────────────────────────────────────────────────────────────────────────────
#        Articles
# ──────────────────────────────────────────────────────────────────────────────

  ## Articles from Europe
  articledb-eu:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5432:5432"  # HostPort:ContainerPort
    volumes:
      - ./database_dev/postgres/article:/docker-entrypoint-initdb.d:ro

  ## Articles from North America
  articledb-na:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
