## Structirizr inde i 'C4 diagram*' anvender port 8081
services:

# ──────────────────────────────────────────────────────────────────────────────
#        Telemetry 
# ──────────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
#      - "9464:9464"   # Prometheus scrape endpoint
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
#    ports:
#      - "3100:3100"
    command: -config.file=/etc/loki/config/config.yaml
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/config/config.yaml:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/data-sources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana

# ──────────────────────────────────────────────────────────────────────────────
#        Articles
# ──────────────────────────────────────────────────────────────────────────────

  ## Articles from Europe
  articledb-eu:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5432:5432"  # HostPort:ContainerPort
    volumes:
      - ./database/init/article/article_baseline.sql:/docker-entrypoint-initdb.d/01_article_baseline.sql:ro
      - ./database/queries/article/seed_reference_data.sql:/docker-entrypoint-initdb.d/02_seed_reference_data.sql:ro

