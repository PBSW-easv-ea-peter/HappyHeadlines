# Monitoring for the whole HappyHeadlines application.
# Joins the app's network (dev by default, see APP_NETWORK below), so start the app stack first - see README.md.
# For monitoring alone with dummy caches and simulated traffic, use docker-compose.dev.yaml.

# Explicit project name - both compose files live in this folder and would otherwise share one.
name: monitoring

services:

# ──────────────────────────────────────────────────────────────────────────────
#        Telemetry pipeline (traces and logs from the services)
# ──────────────────────────────────────────────────────────────────────────────

  # The services send OTLP to http://otel-collector:4318 (see appsettings.*.json).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP - also used by services running on the host
#      - "9464:9464"   # Prometheus scrape endpoint
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
#    ports:
#      - "3200:3200"
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro

  loki:
    image: grafana/loki:latest
#    ports:
#      - "3100:3100"
    command: -config.file=/etc/loki/config/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config/config.yaml:ro

# ──────────────────────────────────────────────────────────────────────────────
#        Metrics
# ──────────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # One exporter per cache, so hit/miss stats stay separated per cache.
  redis-exporter-article:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://article-cache:6379

  redis-exporter-comment:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://comment-cache:6379

# ──────────────────────────────────────────────────────────────────────────────
#        Visualisation
# ──────────────────────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  grafana_data:

# Created by the app stack: happyheadlines-dev (docker-compose.dev.yaml) or happyheadlines-prod
# (docker-compose.yaml). Pick prod with APP_NETWORK=happyheadlines-prod.
networks:
  default:
    name: ${APP_NETWORK:-happyheadlines-dev}
    external: true
