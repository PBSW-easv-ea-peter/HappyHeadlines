apiVersion: apps/v1
kind: Deployment
metadata:
  name: journalist-web
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journalist-web
  template:
    metadata:
      labels:
        app: journalist-web
    spec:
      containers:
        - name: journalist-web
          image: selgaard/boligsom:journalist-web-service
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: ui-config
              mountPath: /usr/share/nginx/html/appsettings.json
              subPath: appsettings.json
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: ui-config
          configMap:
            name: ui-config
            items:
              - key: appsettings.json
                path: appsettings.json
        - name: nginx-config
          configMap:
            name: ui-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: journalist-web
  namespace: prod
spec:
  type: NodePort
  selector:
    app: journalist-web
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 32000
      protocol: TCP
