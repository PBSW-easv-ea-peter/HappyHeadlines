  ## Article Service
  articleservice:
    build:
      context: ./apps/article_service/
    image: happyheadlines/article_service:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"

# ──────────────────────────────────────────────────────────────────────────────
#        Comments 
