## Structirizr inde i 'C4 diagram*' anvender port 8089
# Own project name so prod never shares containers/DB volumes with docker-compose.dev.yaml
name: happyheadlines-prod

x-flyway-article-env: &flyway-article-env
  FLYWAY_USER: postgres
  FLYWAY_PASSWORD: Postgres1234
  FLYWAY_LOCATIONS: filesystem:/flyway/sql
  FLYWAY_CONNECT_RETRIES: "10"

services:

# ──────────────────────────────────────────────────────────────────────────────
#        Articles
# ──────────────────────────────────────────────────────────────────────────────

  ## Articles from Europe
  articledb-eu:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-eu-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-eu:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-eu:
        condition: service_healthy

  ## Articles from North America
  articledb-na:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-na-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-na:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-na:
        condition: service_healthy

  ## Articles from South America
  articledb-sa:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-sa-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-sa:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-sa:
        condition: service_healthy

  ## Articles from Australia
  articledb-au:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-au-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-au:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-au:
        condition: service_healthy

  ## Articles from Asia
  articledb-as:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-as-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-as:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-as:
        condition: service_healthy

  ## Articles from Antarctica
  articledb-an:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-an-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-an:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-an:
        condition: service_healthy

  ## Articles from Africa
  articledb-af:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-af-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-af:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-af:
        condition: service_healthy

  ## Global articles
  articledb-global:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-global-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-global:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-global:
        condition: service_healthy

  ## Article Service
  articleservice:
    build:
      context: ./apps/
      dockerfile: article_service/Dockerfile
    image: happyheadlines/article_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    deploy:
      replicas: 3
    # NOTE: this stack is deployed via `docker stack deploy` (Swarm), which ignores
    # depends_on entirely - this gating is only reliable under plain `docker compose up`
    # (see docker-compose.dev.yaml). Kept here for documentation/local-testing purposes.
    depends_on:
      articledb-eu-migrate:
        condition: service_completed_successfully
      articledb-na-migrate:
        condition: service_completed_successfully
      articledb-sa-migrate:
        condition: service_completed_successfully
      articledb-au-migrate:
        condition: service_completed_successfully
      articledb-as-migrate:
        condition: service_completed_successfully
      articledb-an-migrate:
        condition: service_completed_successfully
      articledb-af-migrate:
        condition: service_completed_successfully
      articledb-global-migrate:
        condition: service_completed_successfully

# ──────────────────────────────────────────────────────────────────────────────
#        Comments
# ──────────────────────────────────────────────────────────────────────────────

  commentdb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    volumes:
      - ./database/init/comment/comment_baseline.sql:/docker-entrypoint-initdb.d/01_comment_baseline.sql:ro
      - ./database/queries/comment/seed_comments.sql:/docker-entrypoint-initdb.d/02_seed_comments.sql:ro

  # CommentCache - filled on miss, LRU over the 30 most recently read articles (docs/Caching.md).
  # No persistence: an empty cache after a restart just fills up again.
  comment-cache:
    image: redis:8.8.3-alpine
    command: redis-server --save "" --appendonly no

  profanitydb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    volumes:
      - ./database/init/profanity/profanity_baseline.sql:/docker-entrypoint-initdb.d/01_profanity_baseline.sql:ro
      - ./database/queries/profanity/seed_banned_words.sql:/docker-entrypoint-initdb.d/02_seed_banned_words.sql:ro

  profanityservice:
    build:
      context: ./apps/
      dockerfile: profanity_service/Dockerfile
    image: happyheadlines/profanity_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
    ports:
      - "8081:8081"

  commentservice:
    build:
      context: ./apps/
      dockerfile: comment_service/Dockerfile
    image: happyheadlines/comment_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8082
    ports:
      - "8082:8082"

# ──────────────────────────────────────────────────────────────────────────────
#        Drafts
# ──────────────────────────────────────────────────────────────────────────────

  draftdb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drafts"]
      interval: 5s
      timeout: 3s
      retries: 10

  draftdb-migrate:
    image: flyway/flyway:10-alpine
    environment:
      FLYWAY_URL: jdbc:postgresql://draftdb:5432/drafts
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: Postgres1234
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./database/migrations/draft:/flyway/sql:ro
    command: migrate
    depends_on:
      draftdb:
        condition: service_healthy

  draftservice:
    build:
      context: ./apps/
      dockerfile: draft_service/Dockerfile
    image: happyheadlines/draft_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8083
    ports:
      - "8083:8083"
    # NOTE: this stack is deployed via `docker stack deploy` (Swarm), which ignores
    # depends_on entirely - this gating is only reliable under plain `docker compose up`
    # (see docker-compose.dev.yaml). Kept here for documentation/local-testing purposes.
    depends_on:
      draftdb-migrate:
        condition: service_completed_successfully

# ──────────────────────────────────────────────────────────────────────────────
#        Publishing
# ──────────────────────────────────────────────────────────────────────────────

  publishservice:
    build:
      context: ./apps/
      dockerfile: publish_service/Dockerfile
    image: happyheadlines/publish_service
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8084
    ports:
      - "8084:8084"
    # NOTE: ignored by `docker stack deploy` (Swarm) - see draftservice above.
    depends_on:
      rabbitmq:
        condition: service_healthy

# ──────────────────────────────────────────────────────────────────────────────
#        Message Brokers
# ──────────────────────────────────────────────────────────────────────────────

  # PublishService publishes published articles here; ArticleService consumes them.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

# ──────────────────────────────────────────────────────────────────────────────
#        Clients
# ──────────────────────────────────────────────────────────────────────────────

  happyheadlines:
    build:
      context: ./apps/happy-headlines-web_service/
    image: happyheadlines/happyheadlines_web
    ports:
      - "8000:8000"

  happyheadlines-reader:
    build:
      context: ./apps/happy-headlines-web_service/
      dockerfile: Dockerfile.reader
    image: happyheadlines/happyheadlines_reader
    ports:
      - "8001:8001"

# =============================================================================
#        Networks
# =============================================================================

# Fixed name (instead of <stack>_default) so monitoring/docker-compose.yaml can join it
# with APP_NETWORK=happyheadlines-prod. Separate from dev, like the project name above.
# attachable: Swarm overlay networks reject plain `docker compose` containers without it.
networks:
  default:
    name: happyheadlines-prod
    attachable: true
