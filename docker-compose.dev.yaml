## Structirizr inde i 'C4 diagram*' anvender port 8081
services:

# ──────────────────────────────────────────────────────────────────────────────
#        Articles
# ──────────────────────────────────────────────────────────────────────────────

  ## Articles from Europe
  articledb-eu:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5432:5432"  # HostPort:ContainerPort
    volumes:
      - ./database/init/article/article_baseline.sql:/docker-entrypoint-initdb.d/01_article_baseline.sql:ro
      - ./database/queries/article/seed_reference_data.sql:/docker-entrypoint-initdb.d/02_seed_reference_data.sql:ro

