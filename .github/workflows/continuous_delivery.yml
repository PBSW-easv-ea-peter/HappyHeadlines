name: Apps CD Pipeline

on:
  # push:
  #   branches:
  #     - feature/Add_CI_Pipeline
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - 'apps/**'

jobs:
  # ---- Step 1: Detect which services changed ----
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for diff

      # - name: Find changed services
      #   id: find
      #   run: |
      #     if [ "${{ github.event_name }}" = "pull_request" ]; then
      #       BASE_SHA="${{ github.event.pull_request.base.sha }}"
      #       HEAD_SHA="${{ github.event.pull_request.head.sha }}"
      #     else
      #       BASE_SHA="${{ github.event.before }}"
      #       HEAD_SHA="${{ github.event.after }}"
      #     fi

      #     echo "Comparing $BASE_SHA → $HEAD_SHA"

      #     CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
      #       | grep '^apps/' \
      #       | cut -d'/' -f2 \
      #       | sort -u \
      #       | jq -R -s -c 'split("\n") | map(select(length > 0))')

      #     echo "services=$CHANGED" >> $GITHUB_OUTPUT
      #     echo "Changed services: $CHANGED"

      # A service is a folder directly under apps/ that has a Dockerfile, so
      # apps/shared, apps/HappyHeadlines.slnx etc. are never built on their own.
      # A change in apps/shared rebuilds every service whose Dockerfile copies it.
      - name: Find changed services
        id: find
        run: |
          CHANGED_DIRS=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
            | grep '^apps/' \
            | cut -d'/' -f2 \
            | sort -u)

          SERVICES=""
          for dockerfile in apps/*/Dockerfile; do
            service=$(basename "$(dirname "$dockerfile")")
            if echo "$CHANGED_DIRS" | grep -qx "$service"; then
              SERVICES="$SERVICES $service"
            elif echo "$CHANGED_DIRS" | grep -qx "shared" && grep -q 'shared/' "$dockerfile"; then
              SERVICES="$SERVICES $service"
            fi
          done

          CHANGED=$(printf '%s\n' $SERVICES | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "services=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed services: $CHANGED"

  # ---- Step 2: Build & push only the changed ones ----
  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One failing service must not cancel the others
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Image names in a registry must be lowercase - both the repository and the service part
      - name: Set image name
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${SERVICE,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The .NET services copy apps/shared and need apps/ as build context.
      # The web apps only copy their own folder and expect it as context.
      - name: Build and push Docker image
        run: |
          SERVICE_DIR=apps/${{ matrix.service }}
          if grep -q 'shared/' "$SERVICE_DIR/Dockerfile"; then
            CONTEXT=apps/
          else
            CONTEXT="$SERVICE_DIR"
          fi
          echo "Building $SERVICE_DIR with context $CONTEXT"

          docker build \
            -f "$SERVICE_DIR/Dockerfile" \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            "$CONTEXT"
          docker push ${{ env.IMAGE_NAME }} --all-tags