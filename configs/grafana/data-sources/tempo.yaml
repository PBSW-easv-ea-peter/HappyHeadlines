apiVersion: 1

# Recreate on startup so the fixed uid below applies even if Grafana's database
# (./tmp-data) still holds an older Tempo datasource with a generated uid.
deleteDatasources:
  - name: Tempo
    orgId: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    basicAuth: false
    jsonData:
      tlsAuth: false
      tlsAuthWithCACert: false
