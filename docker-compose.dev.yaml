  ## Global articles
  articledb-global:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5439:5432"  # HostPort:ContainerPort
    volumes:
      - ./database_dev/postgres/article:/docker-entrypoint-initdb.d:ro
  articleservice:
    build:
      context: ./HappyHeadlines/ArticleService/
    image: happyheadlines/articleservice
    ports:
      - "8080:8080"
    deploy:
      replicas: 3
#    depends_on:
