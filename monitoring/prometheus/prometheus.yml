global:
  scrape_interval: 15s

scrape_configs:
  # The `cache` label lets the dashboard query per cache instead of per hostname,
  # so renaming containers on migration doesn't break any panels.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter-article:9121"]
        labels:
          cache: article
      - targets: ["redis-exporter-comment:9121"]
        labels:
          cache: comment
