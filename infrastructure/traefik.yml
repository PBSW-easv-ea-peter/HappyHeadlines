services:
  traefik:
    image: traefik:v3.7

    command:
      # Tell Traefik to use Docker Swarm as its configuration provider
      - --providers.swarm=true

      # Don't expose every Swarm service automatically
      - --providers.swarm.exposedbydefault=false

      # Tell Traefik which Docker network to use
      - --providers.swarm.network=traefik-public
      
      # Create an HTTP entrypoint
      - --entrypoints.web.address=:80

      # Enable the Traefik dashboard/API
      - --api.dashboard=true

      # Enable HTTP access logs
      - --accesslog=true
      - --log.level=INFO

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - traefik-public

    deploy:
      mode: global # Each node has 1 instance.
#      replicas: 1
#      placement:
#        constraints:
#          - node.role == manager

networks:
  traefik-public:
    external: true
