# backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: publish-service
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: publish-service
  template:
    metadata:
      labels:
        app: publish-service
    spec:
      containers:
        - name: publish-service
          image: selgaard/boligsom:publish-service
          ports:
            - containerPort: 8084
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8084
          envFrom:
            - secretRef:
                name: postgres-password
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: config
          configMap:
            name: publish-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: publish-service
  namespace: prod
spec:
  selector:
    app: publish-service
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30040
  type: NodePort

