server {
    listen 8001;

    root /usr/share/nginx/html;
    index index.html;

    # index.html references the fingerprinted _framework files, so it must be
    # revalidated on every load - without this the browser heuristically caches
    # it and keeps booting an old build after a redeploy. The ETag keeps that
    # revalidation a cheap 304 when nothing changed. Both "/" and the SPA
    # fallback below are internal redirects to /index.html, so this covers them.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Everything else that is not fingerprinted (css, images, logo) is also
    # revalidated, so a rebuilt stylesheet is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # _framework files carry a content fingerprint in their name (a new build
    # means new names), so they are left to normal browser caching.
    location /_framework/ {
        try_files $uri =404;
    }
}
