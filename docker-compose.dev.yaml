  ## Article Service
  articleservice:
    build:
      context: ./apps/
      dockerfile: article_service/Dockerfile
    image: happyheadlines/article_service:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      articledb-eu-migrate:
        condition: service_completed_successfully
      articledb-na-migrate:
        condition: service_completed_successfully
      articledb-sa-migrate:
        condition: service_completed_successfully
      articledb-au-migrate:
        condition: service_completed_successfully
      articledb-as-migrate:
        condition: service_completed_successfully
      articledb-an-migrate:
        condition: service_completed_successfully
      articledb-af-migrate:
        condition: service_completed_successfully
      articledb-global-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  article-cache:
    image: redis:8.8.3-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
# ──────────────────────────────────────────────────────────────────────────────
#        Comments
# ──────────────────────────────────────────────────────────────────────────────

  commentdb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5440:5432"  # HostPort:ContainerPort
    volumes:
      - ./database/init/comment/comment_baseline.sql:/docker-entrypoint-initdb.d/01_comment_baseline.sql:ro
      - ./database/queries/comment/seed_comments.sql:/docker-entrypoint-initdb.d/02_seed_comments.sql:ro

  profanitydb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5441:5432"  # HostPort:ContainerPort
    volumes:
      - ./database/init/profanity/profanity_baseline.sql:/docker-entrypoint-initdb.d/01_profanity_baseline.sql:ro
      - ./database/queries/profanity/seed_banned_words.sql:/docker-entrypoint-initdb.d/02_seed_banned_words.sql:ro

  profanityservice:
    build:
      context: ./apps/
      dockerfile: profanity_service/Dockerfile
    image: happyheadlines/profanity_service:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
    ports:
      - "8081:8081"

  commentservice:
    build:
      context: ./apps/
      dockerfile: comment_service/Dockerfile
    image: happyheadlines/comment_service:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8082
    ports:
      - "8082:8082"

# ──────────────────────────────────────────────────────────────────────────────
#        Drafts
# ──────────────────────────────────────────────────────────────────────────────

  draftdb:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5442:5432"  # HostPort:ContainerPort
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drafts"]
      interval: 5s
      timeout: 3s
      retries: 10

  draftdb-migrate:
    image: flyway/flyway:10-alpine
    environment:
      FLYWAY_URL: jdbc:postgresql://draftdb:5432/drafts
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: Postgres1234
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./database/migrations/draft:/flyway/sql:ro
    command: migrate
    depends_on:
      draftdb:
        condition: service_healthy

  draftservice:
    build:
      context: ./apps/
      dockerfile: draft_service/Dockerfile
    image: happyheadlines/draft_service:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8083
    ports:
      - "8083:8083"
    depends_on:
      draftdb-migrate:
        condition: service_completed_successfully

# ──────────────────────────────────────────────────────────────────────────────
#        Clients
# ──────────────────────────────────────────────────────────────────────────────

  happyheadlines:
    build:
      context: ./apps/happy-headlines-web_service
    image: happyheadlines/happyheadlines_web:dev
    ports:
      - "8000:8000"

  happyheadlines-reader:
    build:
      context: ./apps/happy-headlines-web_service
      dockerfile: Dockerfile.reader
    image: happyheadlines/happyheadlines_reader:dev
    ports:
      - "8001:8001"

# ──────────────────────────────────────────────────────────────────────────────
#        Message Brokers 
# ──────────────────────────────────────────────────────────────────────────────
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    user: "1000"  # Run as non-root (default RabbitMQ user)
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "5672:5672"
      - "15672:15672"
#    volumes:
#      - rabbitmq_data:/var/lib/rabbitmq  # Persist data
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin

# =============================================================================
#        Volumes
# =============================================================================

volumes:
  rabbitmq_data:
  grafana_data:

