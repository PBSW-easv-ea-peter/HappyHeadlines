## Structirizr inde i 'C4 diagram*' anvender port 8081
# Own project name so dev never shares containers/DB volumes with docker-compose.yaml
name: happyheadlines-dev

x-flyway-article-env: &flyway-article-env
  FLYWAY_USER: postgres
  FLYWAY_PASSWORD: Postgres1234
  FLYWAY_LOCATIONS: filesystem:/flyway/sql
  FLYWAY_CONNECT_RETRIES: "10"

services:

# ──────────────────────────────────────────────────────────────────────────────
#        Telemetry
# ──────────────────────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./configs/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
#      - "9464:9464"   # Prometheus scrape endpoint
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
#    ports:
#      - "3200:3200"
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./configs/tempo-config.yaml:/etc/tempo/config.yaml:ro

  loki:
    image: grafana/loki:latest
#    ports:
#      - "3100:3100"
    command: -config.file=/etc/loki/config/config.yaml
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/config/config.yaml:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/data-sources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana

# ──────────────────────────────────────────────────────────────────────────────
#        Articles
# ──────────────────────────────────────────────────────────────────────────────

  ## Articles from Europe
  articledb-eu:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Postgres1234
    ports:
      - "5432:5432"  # HostPort:ContainerPort
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10

  articledb-eu-migrate:
    image: flyway/flyway:10-alpine
    environment:
      <<: *flyway-article-env
      FLYWAY_URL: jdbc:postgresql://articledb-eu:5432/articles
    volumes:
      - ./database/migrations/article:/flyway/sql:ro
    command: migrate
    depends_on:
      articledb-eu:
        condition: service_healthy

  ## Articles from North America
  articledb-na:
    image: postgres:18-trixie
    environment:
