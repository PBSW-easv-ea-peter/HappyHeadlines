receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

#  prometheus:
#    endpoint: 0.0.0.0:9464

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - otlphttp/loki
#        - debug
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters:
        - otlp/tempo
#    metrics:
#      receivers: [otlp]
#      processors: [batch]
#      exporters: [prometheus]
