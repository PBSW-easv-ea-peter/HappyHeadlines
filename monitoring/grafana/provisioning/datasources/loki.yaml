apiVersion: 1

datasources:
  - name: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    readOnly: false
    jsonData:
      pdcInjected: false
      serverName: ""
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: true
      # OTLP logs carry trace_id as structured metadata; link it to the trace in Tempo.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
