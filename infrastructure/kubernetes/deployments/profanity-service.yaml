# backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profanity-service
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profanity-service
  template:
    metadata:
      labels:
        app: profanity-service
    spec:
      containers:
        - name: profanity-service
          image: selgaard/boligsom:profanity-service
          ports:
            - containerPort: 8081
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8081
          envFrom:
            - secretRef:
                name: postgres-password
          volumeMounts:
            - name: config
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
              readOnly: true
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: config
          configMap:
            name: profanity-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: profanity-service
  namespace: prod
spec:
  selector:
    app: profanity-service
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30010
  type: NodePort

