# Monitoring on its own - no app stack needed. Dummy caches stand in for ArticleCache and
# CommentCache, and the traffic simulator generates hits and misses. See README.md.
# Mirrors docker-compose.yaml - keep the shared services in sync.

# Explicit project name - both compose files live in this folder and would otherwise share one.
name: monitoring-dev

services:

# ──────────────────────────────────────────────────────────────────────────────
#        Telemetry pipeline (traces and logs from the services)
# ──────────────────────────────────────────────────────────────────────────────

  # Receives OTLP from services you run on the host (http://localhost:4318).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/config/config.yaml
    volumes:
      - ./loki/config.yaml:/etc/loki/config/config.yaml:ro

# ──────────────────────────────────────────────────────────────────────────────
#        Metrics
# ──────────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    command: --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  redis-exporter-article:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis-article:6379

  redis-exporter-comment:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis-comment:6379

# ──────────────────────────────────────────────────────────────────────────────
#        Visualisation
# ──────────────────────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

# ──────────────────────────────────────────────────────────────────────────────
#        Dummy caches and simulation
# ──────────────────────────────────────────────────────────────────────────────

  # maxmemory = empty Redis (article ~1 667 000 B, comment ~1 693 000 B, measured under load) + capacity.
  # The capacity is also set as a constant in the dashboard (variables article_capacity /
  # comment_capacity) - change both places when you raise a limit. See README.md.
  redis-article:
    image: redis:latest
    # Capacity: 150 articles x 5 186 B (4 KB payload incl. Redis overhead) = 780 000 B
    command: redis-server --maxmemory 2447000 --maxmemory-policy allkeys-lru

  redis-comment:
    image: redis:latest
    # Capacity: 50 articles' comments x 2 613 B (2 KB payload incl. Redis overhead) = 131 000 B
    command: redis-server --maxmemory 1824000 --maxmemory-policy allkeys-lru

  # Simulated reader traffic against the dummy caches - only started with `--profile simulate`.
  traffic-simulator:
    image: redis:latest
    profiles: [simulate]
    entrypoint: ["bash", "/scripts/simulate-traffic.sh"]
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - redis-article
      - redis-comment
