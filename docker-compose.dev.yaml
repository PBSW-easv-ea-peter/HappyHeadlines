  ## Article Service
  articleservice:
    build:
      context: ./apps/article_service/
    image: happyheadlines/article_service:dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      articledb-eu-migrate:
        condition: service_completed_successfully
      articledb-na-migrate:
        condition: service_completed_successfully
      articledb-sa-migrate:
        condition: service_completed_successfully
      articledb-au-migrate:
        condition: service_completed_successfully
      articledb-as-migrate:
